name: "hydra"
arch: "amd64"
platform: "linux"
version: "v1.0.0"
section: "net"
priority: "optional"
maintainer: "Raunak <raunak@hydra.local>"
description: "High-Performance Native Linux Download Engine"
vendor: "Hydra"
homepage: "https://github.com/Raunak0000/Hydra"
license: "MIT"

contents:
  - src: ./bin/hydra-daemon
    dst: /usr/bin/hydra-daemon
    file_info:
      mode: 0755

  - src: ./bin/hydra
    dst: /usr/bin/hydra
    file_info:
      mode: 0755

  - src: ./bin/hydra-tui
    dst: /usr/bin/hydra-tui
    file_info:
      mode: 0755

  - src: ./packaging/tray/hydra-tray
    dst: /usr/bin/hydra-tray
    file_info:
      mode: 0755

  - src: ./packaging/gui/hydra-gui
    dst: /usr/bin/hydra-gui
    file_info:
      mode: 0755

  - src: ./packaging/gui/hydra_gui/__init__.py
    dst: /usr/share/hydra/gui/hydra_gui/__init__.py
    file_info:
      mode: 0644

  - src: ./packaging/gui/hydra_gui/client.py
    dst: /usr/share/hydra/gui/hydra_gui/client.py
    file_info:
      mode: 0644

  - src: ./packaging/gui/hydra_gui/details_view.py
    dst: /usr/share/hydra/gui/hydra_gui/details_view.py
    file_info:
      mode: 0644

  - src: ./packaging/gui/hydra_gui/dialogs.py
    dst: /usr/share/hydra/gui/hydra_gui/dialogs.py
    file_info:
      mode: 0644

  - src: ./packaging/gui/hydra_gui/models.py
    dst: /usr/share/hydra/gui/hydra_gui/models.py
    file_info:
      mode: 0644

  - src: ./packaging/gui/hydra_gui/theme.py
    dst: /usr/share/hydra/gui/hydra_gui/theme.py
    file_info:
      mode: 0644

  - src: ./packaging/gui/hydra_gui/window.py
    dst: /usr/share/hydra/gui/hydra_gui/window.py
    file_info:
      mode: 0644

  - src: ./packaging/systemd/hydra.service
    dst: /usr/lib/systemd/user/hydra.service
    file_info:
      mode: 0644

  - src: ./packaging/desktop/hydra.desktop
    dst: /usr/share/applications/hydra.desktop
    file_info:
      mode: 0644

  - src: ./packaging/desktop/hydra-gui.desktop
    dst: /usr/share/applications/hydra-gui.desktop
    file_info:
      mode: 0644

  - src: ./packaging/autostart/hydra-daemon.desktop
    dst: /etc/xdg/autostart/hydra-daemon.desktop
    file_info:
      mode: 0644

  - src: ./packaging/autostart/hydra-tray.desktop
    dst: /etc/xdg/autostart/hydra-tray.desktop
    file_info:
      mode: 0644

  - src: ./packaging/icons/hydra.svg
    dst: /usr/share/icons/hicolor/scalable/apps/hydra.svg
    file_info:
      mode: 0644

  - src: ./packaging/extension/hydra-native-host
    dst: /usr/bin/hydra-native-host
    file_info:
      mode: 0755

  - src: ./packaging/extension/org.hydra.downloader.json
    dst: /usr/lib/mozilla/native-messaging-hosts/org.hydra.downloader.json
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/scripts/postinst
  preremove: ./packaging/scripts/prerm