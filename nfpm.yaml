name: "hydra"
arch: "amd64"
platform: "linux"
version: "v1.0.0"
section: "net"
priority: "optional"
maintainer: "Raunak <raunak@hydra.local>"
description: "High-Performance Native Linux Download Engine"
vendor: "Hydra"
homepage: "https://github.com/Raunak0000/Hydra"
license: "MIT"

contents:
  - src: ./bin/hydra-daemon
    dst: /usr/bin/hydra-daemon
    file_info:
      mode: 0755

  - src: ./bin/hydra
    dst: /usr/bin/hydra
    file_info:
      mode: 0755

  - src: ./packaging/systemd/hydra.service
    dst: /usr/lib/systemd/user/hydra.service
    file_info:
      mode: 0644

  - src: ./packaging/desktop/hydra.desktop
    dst: /usr/share/applications/hydra.desktop
    file_info:
      mode: 0644

  - src: ./packaging/icons/hydra.svg
    dst: /usr/share/icons/hicolor/scalable/apps/hydra.svg
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/scripts/postinst
  preremove: ./packaging/scripts/prerm