name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip dpkg desktop-file-utils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build and Validate Packages
        run: |
          chmod +x ./build.sh ./scripts/validate-package.sh
          ./build.sh
          ./scripts/validate-package.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/hydra-extension.zip
            dist/SHA256SUMS
            bin/hydra
            bin/hydra-daemon
            bin/hydra-tui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
